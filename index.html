<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the crossing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: black;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        


        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            z-index: 5;
        }

        .loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Loading video...</div>
    
    <video id="video" loop muted></video>

    <script>
        // ============================================
        // CONFIGURATION: Change this to your video URL
        // ============================================
        const VIDEO_URL = 'output.webm';  // Change this to your video file path or URL
        // ============================================

        const video = document.getElementById('video');
        const loading = document.getElementById('loading');

        // Set video source
        video.src = VIDEO_URL;

        function jumpToRandomPosition() {
            if (video.duration && !isNaN(video.duration)) {
                const randomTime = Math.random() * video.duration;
                video.currentTime = randomTime;
            }
        }

        // Random start position on load
        video.addEventListener('loadedmetadata', () => {
            loading.classList.add('hidden');
            jumpToRandomPosition();
        });

        // Auto-play when ready
        video.addEventListener('canplay', () => {
            video.play().catch(err => {
                console.log('Autoplay blocked - click to play:', err);
                // If autoplay is blocked, show a play button
                if (video.paused) {
                    loading.textContent = 'Click anywhere to play';
                    loading.classList.remove('hidden');
                    document.body.addEventListener('click', () => {
                        video.play();
                        loading.classList.add('hidden');
                    }, { once: true });
                }
            });
        }, { once: true });
    </script>
</body>
</html>
